/** 변경 후 포트폴리오 위험등급을 실시간으로 보여줌 */
function updateRiskLine(root, flow) {
  const line = $('#riskLine', root);
  if (!line) return;
  const ratios = currentFundRatios(flow);
  if (ratios.reduce((sum, ratio) => sum + ratio, 0) !== 100) { line.innerHTML = ''; return; }
  const { average, grade } = portfolioGrade(ratios);
  const profile = profileByName(SUITABILITY.profile);
  const fits = requiredProfileFor(grade).level <= profile.level;
  line.className = `risk-line ${fits ? 'ok' : 'over'}`;
  line.innerHTML = `변경 후 포트폴리오 위험 <b>${gradeLabel(grade)}</b> <span class="num">(가중평균 ${average.toFixed(1)})</span> · ${fits
    ? `현재 투자성향(${profile.name}) 범위 안입니다.`
    : `현재 투자성향(${profile.name})보다 위험합니다. 변경하려면 적합성진단이 필요합니다.`}`;
}

/** 변경하기: 진단이 필요한지 판단 */
function submitFundChange(flow) {
  const ratios = currentFundRatios(flow);
  if (!hasFundChange(flow)) return toast('변경된 내용이 없습니다. 변경 후 비율이나 자동재배분을 바꿔 주세요.');
  const check = suitabilityCheck(ratios);
  if (!check.reasons.length) return showFundPhase('compare');

  if (SUITABILITY.failedOn === APP.today) {
    return openModal(`
      <h2>오늘은 적합성진단을 다시 할 수 없습니다</h2>
      <p>오늘 진행한 적합성진단 결과(${SUITABILITY.profile})로는 변경 후 편입비율(${gradeLabel(check.grade)})에 투자할 수 없습니다.</p>
      ${infoBox('warn', 'alert', `${nextDay(APP.today)}(익일) 이후 적합성진단을 다시 진행해 주세요. 투자성향 범위 안으로 비율을 조정하면 바로 변경할 수 있습니다.`)}
      <button class="btn pri block mt-16" data-action="close-modal">확인</button>`);
  }

  openModal(`
    <h2>적합성진단이 필요합니다</h2>
    <p>아래 사유로 펀드를 변경하기 전에 투자자 적합성진단을 먼저 진행합니다.</p>

function scoreToProfile(score) {
  return INVEST_PROFILES.find(profile => score <= profile.maxScore) || INVEST_PROFILES[INVEST_PROFILES.length - 1];
}

const FUND_REBALANCE_BEFORE = false;   // 현재 자동재배분 신청 여부 (샘플)
const FUND_BAR_COLORS = ['#00786F', '#2558C4', '#8F5800', '#6B7A8C', '#7A3FB0', '#B0413E'];

function hasFundChange(flow) {
  const after = currentFundRatios(flow);
  const ratioChanged = activeFunds().some(([, before], index) => before !== after[index]);
  return ratioChanged || Boolean(flow.rebalance) !== FUND_REBALANCE_BEFORE;
}

function changeBadge(delta) {
  if (!delta) return '<span class="delta same" aria-hidden="true">–</span><span class="sr-only">변동 없음</span>';
  return delta > 0
    ? `<span class="delta up">▲ ${delta}%p<span class="sr-only"> 증가</span></span>`
    : `<span class="delta down">▼ ${-delta}%p<span class="sr-only"> 감소</span></span>`;
}

  </div>
  <div class="card">
    <h2>함께 바뀌는 내용</h2>
    <dl class="kv cmp-kv">

      <dt>올해 남은 변경 횟수</dt><dd class="num">${selectedVariableContract().variable.fundChangesLeft}회 → <b>${selectedVariableContract().variable.fundChangesLeft - 1}회</b></dd>

function bindSingleForm(screen, root) {
  const config = CHANGE_FORMS[screen.id];
  const flow = state.screen.flow;
  bindFormBehaviors(root, config, flow);
  const fundInputs = bindFundTotal(root);
  if (config.custom === 'fund') bindFundExtras(root, flow);
  if (config.custom === 'notice') bindNoticeSettings(root, flow);

  const nextButton = $('#next', root);
  if (!nextButton) return;
  nextButton.onclick = () => {
    if (config.fields) {
      Object.assign(flow.values, readFieldValues(root, config.fields));
      if (!validateFields(root, config.fields, flow.values)) return;
    }
    if (fundInputs.length && fundTotal(fundInputs) !== 100) return toast('변경 후 비율 합계를 100%로 맞춰 주세요.');
    if (config.agree && flow.agreed.length < config.agree.length) {
      $('#agrErr', root).textContent = '필수 확인 항목에 체크해 주세요.';
      return;
    }
    if (config.custom === 'fund') return submitFundChange(flow);
    chooseSignMethod(screen, () => completeSingleForm(flow));
  };
}

/** 단일폼 변경 완료 화면으로 */
function completeSingleForm(flow) {
  flow.phase = 'edit';
  flow.step = 1;
  rerenderScreen();
  scrollToTop();
  toast('변경되었습니다.');
}

function bindFundExtras(root, flow) {
  if (flow.phase === 'diagnose') {
    $$('input[data-q]', root).forEach(radio => radio.addEventListener('change', () => {
      (flow.suitAnswers ??= {})[radio.dataset.q] = Number(radio.dataset.o);
      $('#sqErr' + radio.dataset.q, root).textContent = '';
    }));
    return;
  }
  if (flow.phase === 'result') return;
  $$('[data-fund]', root).forEach((input, index) => input.addEventListener('input', () => {
    (flow.fundRatios ??= currentFundRatios(flow))[index] = Number(input.value) || 0;
    updateRiskLine(root, flow);
  }));
  const rebalance = $('#rebal', root);
  if (rebalance) rebalance.onchange = () => { flow.rebalance = rebalance.checked; };
  const demo = $('[data-demo-diag]', root);
  if (demo) demo.onchange = () => { SUITABILITY.diagnosedAt = demo.value; SUITABILITY.failedOn = null; rerenderScreen(); };
  updateRiskLine(root, flow);
}

/* 안내장수신설정 (SL-MY-02): 수신 방법 ↔ 전자적방법 수신동의 연동
   ① 모바일·이메일을 고르면 수신동의 자동 체크
   ② 수신동의 해제 시 확인 팝업 → 예: 모바일·이메일 → 우편(자택) / 아니오·X: 그대로 */
function bindNoticeSettings(root, flow) {
  const consent = $('#eConsent', root);
  if (!consent) return;   // 완료 화면
  const selects = $$('[data-notice-method]', root);
  const saveMethods = () => { flow.values.noticeMethods = selects.map(select => select.value); };
  const setConsent = checked => { consent.checked = checked; flow.values.eConsent = checked; };
  const isElectronic = method => NOTICE_ELECTRONIC_METHODS.includes(method);

  selects.forEach(select => select.addEventListener('change', () => {
    saveMethods();
    if (isElectronic(select.value) && !consent.checked) {
      setConsent(true);
      announce('모바일·이메일 수신을 선택해 전자적방법 수신동의에 체크했습니다.');
    }
  }));

  consent.addEventListener('change', () => {
    if (consent.checked) return setConsent(true);
    setConsent(true);   // 팝업에서 '예'를 고를 때까지 체크 유지
    confirmDialog({
      title: '전자적방법 수신동의 해제',
      message: '전자적방법 수신동의 체크 해제 시 안내장별 수신 방법을 우편으로 선택하셔야 합니다. 해제하시겠습니까?',
      onYes: () => {
        const changed = selects.filter(select => isElectronic(select.value));
        changed.forEach(select => { select.value = NOTICE_POST_DEFAULT; });
        saveMethods();
        setConsent(false);
        toast(changed.length ? `${changed.length}개 안내장의 수신 방법을 ${NOTICE_POST_DEFAULT}으로 바꿨습니다.` : '전자적방법 수신동의를 해제했습니다.');
        focusElement(consent);
      },
      onNo: () => focusElement(consent),
    });
  });
}

const fundTotal = inputs => inputs.reduce((sum, input) => sum + (Number(input.value) || 0), 0);

/** 펀드 비율 합계를 실시간으로 보여주고 100%가 아니면 빨간색으로 */
function bindFundTotal(root) {
  const inputs = $$('[data-fund]', root);
  if (!inputs.length) return inputs;
  const totalLabel = $('#fsum', root);
  const update = () => {
    const total = fundTotal(inputs);
    totalLabel.textContent = total === 100 ? '100%' : `${total}% (100%로 맞춰 주세요)`;   // 색에만 의존하지 않도록 글자로도 안내
    totalLabel.className = `num ${total === 100 ? 'is-valid' : 'is-invalid'}`;
  };
  inputs.forEach(input => { input.oninput = update; });
  update();
  return inputs;
}

/* 10-7. T5 발급: 조건 선택 → 즉시 발급(견본 증명서) ------------------------- */

function renderIssuance(screen) {

function issuedCertificate(config, flow) {

function bindIssuance(screen, root) {
  if (screen.authLevel === 'A0' || state.screen.flow.step === 1) return;
  const config = CERTIFICATES[screen.id];

  const syncReceiveFields = () => {
    const method = $('input[name=recv]:checked', root).value;
    $('#emailF', root).hidden = method !== '이메일로 받기';
    $('#faxF', root).hidden = method !== '팩스로 받기';
  };
  $$('input[name=recv]', root).forEach(radio => { radio.onchange = syncReceiveFields; });
  syncReceiveFields();

  $('#issue', root).onclick = () => {
    const values = readFieldValues(root, [...config.fields, RECEIVE_FIELD]);
    values.email = $('#email', root).value;
    values.fax = $('#fax', root).value;
    if (values.recv === '팩스로 받기' && !PHONE_PATTERN.test(values.fax)) {
      $('#faxErr', root).textContent = '팩스번호를 확인해 주세요.';
      return;
    }
    for (const key of ['from', 'to', 'base']) if (values[key]) values[key] = values[key].replace(/-/g, '.');

    Object.assign(state.screen.flow, { values, step: 1 });
    rerenderScreen();
    scrollToTop();
  };
}


/* 11. 폼 엔진 ============================================================= */
/*  필드 정의 예: { id:'amt', label:'인출 금액', type:'money', max:5210000, min:100000, quick:[100000,'max'] }
    type: text(기본) · tel · email · date · select · radio · checks · money · account · file · addr
    optional: true 이면 필수 아님                                                         */

/** 본인 정보 입력칸의 자동완성 값 (KWCAG 28번 반복 입력 정보) */
const AUTOCOMPLETE = { mob: 'tel', telH: 'tel', telW: 'work tel', mail: 'email' };

/** 입력칸 하나: 레이블 · 필수 표시(별표 + 글자) · 도움말 · 오류 문구를 서로 연결 (KWCAG 25 · 26번) */
/** 조건부 항목: showWhen { field, value } — 다른 항목 값이 맞을 때만 보이고 검증함 */
const currentFieldValue = (field, values) => values[field.id] ?? field.value ?? (field.type === 'radio' ? field.options[0] : '');
function isFieldVisible(field, fields, values) {
  if (!field.showWhen) return true;
  const source = fields.find(item => item.id === field.showWhen.field);
  return !source || currentFieldValue(source, values) === field.showWhen.value;
}

function renderField(field, values, fields = []) {
  const value = values[field.id] ?? field.value ?? '';
  const required = field.optional ? '' : '<span class="req" aria-hidden="true">*</span><span class="sr-only">(필수)</span>';
  const isGroup = ['radio', 'checks', 'addr'].includes(field.type);
  const label = isGroup
    ? `<span class="lb" id="lb-${field.id}">${field.label}${required}</span>`
    : `<label for="${field.id}">${field.label}${required}</label>`;

  return `
  <div class="fld${field.wide ? ' wide' : ''}" data-f="${field.id}"${isFieldVisible(field, fields, values) ? '' : ' hidden'}>
    ${label}
    ${fieldControl(field, value, values)}
    ${when(field.help, `<span class="help" id="h-${field.id}">${field.help}</span>`)}
    <span class="err" id="e-${field.id}" role="alert"></span>
  </div>`;
}

/** 입력 요소 공통 속성: 필수 · 설명 연결 · 자동완성 */
function fieldAttributes(field, extraDescribedBy = '') {
  const describedBy = [field.help && `h-${field.id}`, `e-${field.id}`, extraDescribedBy].filter(Boolean).join(' ');
  const autocomplete = AUTOCOMPLETE[field.id] ? ` autocomplete="${AUTOCOMPLETE[field.id]}"` : '';
  return `${field.optional ? '' : 'aria-required="true"'} aria-describedby="${describedBy}"${autocomplete}`;
}

function fieldControl(field, value, values) {
  const { id } = field;
  switch (field.type) {
    case 'select':
      return `<select class="inp" id="${id}" name="${id}" ${fieldAttributes(field)}>${when(field.placeholder, `<option value="" ${value ? '' : 'selected'}>${field.placeholder}</option>`)}${each(field.options, option => `<option ${value === option ? 'selected' : ''}>${option}</option>`)}</select>`;

    case 'account':
      return `<select class="inp" id="${id}" name="${id}" ${fieldAttributes(field)}>${each(ACCOUNTS, option => `<option ${value === option ? 'selected' : ''}>${option}</option>`)}<option>다른 본인 계좌 등록</option></select>`;

    case 'radio':
      return `<div class="radios" role="radiogroup" aria-labelledby="lb-${id}" aria-describedby="${field.help ? `h-${id} ` : ''}e-${id}">${each(field.options, option =>
        `<label><input type="radio" name="${id}" value="${escapeHtml(option)}" ${(value || field.options[0]) === option ? 'checked' : ''}>${option}</label>`)}</div>`;

    case 'checks': {
      const checked = Array.isArray(value) ? value : field.value || [];
      return `<div class="checks${field.inline ? ' inline' : ''}" role="group" aria-labelledby="lb-${id}" aria-describedby="${field.help ? `h-${id} ` : ''}e-${id}">${each(field.options, option =>
        `<label><input type="checkbox" name="${id}" value="${escapeHtml(option)}" ${checked.includes(option) ? 'checked' : ''}><span>${option}</span></label>`)}</div>`;
    }

    case 'money':
      return `
        <div class="money"><input class="inp num" id="${id}" name="${id}" inputmode="numeric" value="${value ? Number(value).toLocaleString() : ''}" placeholder="0" data-money data-max="${field.max || ''}" ${fieldAttributes(field)}><span class="u" aria-hidden="true">원</span></div>
        ${field.quick ? `<div class="chips quick-amounts">${each(field.quick, amount =>
          `<button type="button" class="chip" data-add="${amount}" data-for="${id}" aria-label="${amount === 'max' ? '최대 금액 입력' : `+${amount / 10000}만 (${(amount / 10000).toLocaleString()}만원 더하기)`}">${amount === 'max' ? '최대' : `+${amount / 10000}만`}</button>`)}</div>` : ''}`;

    case 'file':
      return `
        <label class="file-drop" for="${id}">${icon('upload')}<b>사진 찍기 또는 파일 선택</b><small>${field.placeholder || 'JPG·PNG·PDF, 최대 20장'}</small><input type="file" id="${id}" name="${id}" multiple accept="image/*,.pdf" ${fieldAttributes(field, `fl-${id}`)}></label>
        <div class="files" id="fl-${id}" aria-live="polite"></div>`;

    case 'addr':
      return `
        <div class="inrow"><input class="inp num zip" id="${id}_zip" name="${id}_zip" value="${escapeHtml(values[id + '_zip'] ?? field.zip ?? '')}" readonly aria-label="${field.label} 우편번호" autocomplete="postal-code"><button type="button" class="btn" data-zip="${id}" aria-label="${field.label} 우편번호 검색">우편번호 검색</button></div>
        <input class="inp" id="${id}" name="${id}" value="${escapeHtml(value)}" aria-label="${field.label} 기본주소" autocomplete="street-address" ${field.optional ? '' : 'aria-required="true"'} aria-describedby="e-${id}">
        <input class="inp" id="${id}_d" name="${id}_d" placeholder="상세주소" value="${escapeHtml(values[id + '_d'] ?? '')}" aria-label="${field.label} 상세주소" autocomplete="address-line2">`;

    default:
      return `<input class="inp ${field.numeric ? 'num' : ''}" type="${field.type || 'text'}" id="${id}" name="${id}" value="${escapeHtml(value)}" placeholder="${field.placeholder || ''}" ${field.type === 'tel' ? 'inputmode="tel"' : ''} ${fieldAttributes(field)}>`;
  }
}

/** 확인 단계에 보여줄 값 */
function displayValue(field, values) {
  const value = values[field.id];
  if (field.type === 'money') return value ? formatWon(value) : '-';
  if (field.type === 'addr')  return `(${values[field.id + '_zip']}) ${values[field.id]} ${values[field.id + '_d'] || ''}`;
  if (Array.isArray(value))   return value.length ? value.join(', ') : '-';
  return value;
}

function readFieldValues(root, fields) {
  const values = {};
  for (const field of fields) {
    const { id } = field;
    if (!$(`[data-f="${id}"]`, root)) continue;   // 화면에 없는 칸은 읽지 않음 (다른 단계에서 값이 지워지지 않게)
    switch (field.type) {
      case 'radio':  values[id] = $(`input[name="${id}"]:checked`, root)?.value ?? ''; break;
      case 'checks': values[id] = $$(`input[name="${id}"]:checked`, root).map(input => input.value); break;
      case 'money':  values[id] = toNumber($('#' + id, root)?.value ?? 0); break;
      case 'file':   values[id] = [...($('#' + id, root)?.files ?? [])].map(file => file.name); break;
      case 'addr':   for (const suffix of ['', '_zip', '_d']) { const input = $('#' + id + suffix, root); if (input) values[id + suffix] = input.value; } break;
      default:       values[id] = $('#' + id, root)?.value ?? '';
    }
  }
  return values;
}

/** 필수 입력 · 형식 · 금액 범위를 검사하고, 첫 오류 위치로 스크롤 */
function validateFields(root, fields, values) {
  let isValid = true;

  for (const field of fields) {
    const errorLabel = $('#e-' + field.id, root);
    if (!errorLabel || errorLabel.closest('.fld')?.hidden) continue;   // 숨겨진 조건부 항목은 검증 제외
    const input = $('#' + field.id, root);
    errorLabel.textContent = '';
    input?.classList.remove('bad');
    input?.removeAttribute('aria-invalid');
    if (field.optional) continue;

    const message = validationMessage(field, values[field.id]);
    if (message) {
      isValid = false;
      errorLabel.textContent = message;
      input?.classList.add('bad');
      input?.setAttribute('aria-invalid', 'true');
    }
  }

  /* 첫 오류 칸으로 초점 이동 (KWCAG 25번 오류 정정) */
  if (!isValid) {
    const firstError = $('.err:not(:empty)', root)?.closest('.fld');
    firstError?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    focusElement($('input:not([type=hidden]), select, textarea', firstError) || firstError);
  }
  return isValid;
}

/** 받침에 따라 '을/를' 붙이기: '나이' → '나이를', '계약' → '계약을' */
function withObjectParticle(word) {
  const code = word.charCodeAt(word.length - 1) - 0xAC00;
  if (code < 0 || code > 11171) return `${word}을(를)`;
  return word + (code % 28 ? '을' : '를');
}

function validationMessage(field, value) {
  switch (field.type) {
    case 'money':
      if (!value) return `${field.label}을(를) 입력해 주세요.`;
      if (field.max && value > field.max) return `최대 ${formatWon(field.max)}까지 가능합니다.`;
      if (field.min && value < field.min) return `최소 ${formatWon(field.min)} 이상 입력해 주세요.`;
      return '';
    case 'checks': return value.length ? '' : '한 개 이상 선택해 주세요.';
    case 'file':   return value.length ? '' : '증빙서류를 1장 이상 올려 주세요.';
    case 'tel':    return PHONE_PATTERN.test(value) ? '' : '전화번호 형식을 확인해 주세요. 예: 010-1234-5678';
    case 'email':  return EMAIL_PATTERN.test(value) ? '' : '이메일 주소 형식을 확인해 주세요.';
    case 'select': return field.placeholder && !value ? `${withObjectParticle(field.label)} 선택해 주세요.` : '';
    case 'radio': case 'account': case 'addr': return '';
    default:       return String(value).trim() ? '' : `${field.label}을(를) 입력해 주세요.`;
  }
}

/** 폼 공통 동작: 금액 입력 · 빠른 금액 · 파일 목록 · 우편번호 · 실시간 계산 · 동의 체크 */
function bindFormBehaviors(root, config, flow) {
  const fields = config.fields || [];
  const calcTarget = $('#calc', root);
  const recalc = () => {
    if (!calcTarget || !config.calc) return;
    Object.assign(flow.values, readFieldValues(root, fields));
    calcTarget.innerHTML = calcBox(config.calc(flow.values, flow.pick));
  };

  $$('[data-money]', root).forEach(input => input.addEventListener('input', () => {
    const digits = input.value.replace(/[^\d]/g, '');
    input.value = digits ? Number(digits).toLocaleString() : '';
    recalc();
  }));

  $$('[data-add]', root).forEach(button => {
    button.onclick = () => {
      const input = $('#' + button.dataset.for, root);
      const max = Number(input.dataset.max) || Infinity;
      const amount = button.dataset.add === 'max' ? max : Math.min(toNumber(input.value) + Number(button.dataset.add), max);
      input.value = amount.toLocaleString();
      recalc();
    };
  });

  $$('[data-zip]', root).forEach(button => {
    button.onclick = () => openZipSearch(root, button.dataset.zip);
  });

  /* 선택 상자를 고르면 남아 있던 오류 문구를 지움 */
  $$('select', root).forEach(select => select.addEventListener('change', () => {
    if (!select.value || !select.hasAttribute('aria-invalid')) return;
    select.classList.remove('bad');
    select.removeAttribute('aria-invalid');
    const errorLabel = $('#e-' + select.id, root);
    if (errorLabel) errorLabel.textContent = '';
  }));

  $$('[data-agree]', root).forEach(checkbox => {
    checkbox.onchange = () => { flow.agreed = $$('[data-agree]:checked', root).map(item => Number(item.dataset.agree)); };
  });

  if (config.lockRules) {
    applyLockRules(root, config, flow);
    $$('input[type=radio]', root).forEach(radio => radio.addEventListener('change', () => {
      const changed = applyLockRules(root, config, flow);
      if (changed.length) announce(`바뀐 항목: ${changed.join(', ')}`);
    }));
  }

  /* 조건부 항목 보이기/숨기기 */
  const conditionalFields = fields.filter(field => field.showWhen);
  if (conditionalFields.length) {
    const updateVisibility = () => {
      const values = readFieldValues(root, fields);
      conditionalFields.forEach(field => { const group = $(`[data-f="${field.id}"]`, root); if (group) group.hidden = !isFieldVisible(field, fields, values); });
    };
    $$('input, select', root).forEach(input => input.addEventListener('change', updateVisibility));
  }

  $$('input, select', root).forEach(input => input.addEventListener('change', recalc));
  bindFileList(root);
  recalc();
}

/** 파일을 고르면 파일 이름을 칩으로 보여줌 */
function bindFileList(root) {
  $$('input[type=file]', root).forEach(input => input.addEventListener('change', () => {
    const list = $('#fl-' + input.id, root);
    if (list) list.innerHTML = each([...input.files], file => `<span class="fchip">${escapeHtml(file.name)}</span>`);
  }));
}

function openZipSearch(root, fieldId) {
  const modal = openModal(`
    <h2>우편번호 검색</h2>
    <p>도로명, 건물명 또는 지번을 입력하세요.</p>
    <label class="sr-only" for="zq">도로명, 건물명 또는 지번</label>
    <div class="inrow"><input class="inp" id="zq" value="세종대로 110"><button class="btn navy" id="zgo">검색</button></div>
    <div class="mt-12" id="zres" role="group" aria-label="검색 결과" aria-live="polite"></div>
    <button class="btn block mt-12" data-action="close-modal">닫기</button>`);

  const showResults = () => {
    $('#zres', modal).innerHTML = each(ZIP_SAMPLES, ([zip, address]) => `
      <button class="pick mb-6" data-zip-code="${zip}" data-address="${address}"><span class="pm"><b class="num">${zip}</b><small>${address}</small></span></button>`);
    $$('[data-zip-code]', modal).forEach(result => {
      result.onclick = () => {
        $('#' + fieldId + '_zip', root).value = result.dataset.zipCode;
        $('#' + fieldId, root).value = result.dataset.address;
        closeModal();
        $('#' + fieldId + '_d', root).focus();
      };
    });
  };
  $('#zgo', modal).onclick = showResults;
  showResults();
}

/* 12-1. 큰글씨모드 */
function setLargeText(isOn, { announce = false } = {}) {
  state.ui.largeText = isOn;
  document.documentElement.classList.toggle('big', isOn);
  storage.set(APP.storageKeys.largeText, isOn ? '1' : '0');
  render();
  if (announce) toast(isOn ? '큰글씨모드를 켰습니다.' : '기본 글씨로 돌아왔습니다.');
}

/* 12-2. 바탕화면·홈 화면 바로가기 */
const device = {
  isIOS:     () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  isAndroid: () => /Android/.test(navigator.userAgent),
};
const shortcut = {
  iconPng: '',

/** 홈 화면 아이콘(PNG)을 그려 apple-touch-icon · favicon으로 등록 */
function registerAppIcon() {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 180;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#00A49A';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(0, 0, 180, 180, 40) : ctx.rect(0, 0, 180, 180);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '800 78px "Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('iM', 90, 94);
    shortcut.iconPng = canvas.toDataURL('image/png');

    for (const rel of ['apple-touch-icon', 'icon']) {
      const link = document.createElement('link');
      link.rel = rel;
      link.href = shortcut.iconPng;
      document.head.appendChild(link);
    }
  } catch { /* 아이콘을 못 그려도 기능은 계속 */ }
}

/** PC 바탕화면용 바로가기 파일 내려받기 (Windows .url / Mac .webloc) */
function downloadShortcut(kind) {
  const { name, url } = APP.shortcut;
  const isMac = kind === 'mac';
  const body = isMac
    ? `<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>URL</key><string>${url}</string></dict></plist>\n`
    : `[InternetShortcut]\r\nURL=${url}\r\nIconIndex=0\r\n`;

  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([body], { type: isMac ? 'application/xml' : 'application/octet-stream' }));
  link.download = name + (isMac ? '.webloc' : '.url');
  document.body.appendChild(link);
  link.click();
  setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 500);
  toast('바로가기 파일을 내려받았습니다. 바탕화면으로 옮겨 주세요.');
}

/** 클릭 가능한 요소는 모두 data-action="이름" 을 갖고, 여기 한 곳에서 처리 */
const ACTIONS = {
  /* 이동 */
  'nav':               ({ page }) => navigate(page),
  'open':              ({ id, variable }) => { if (variable) state.variableNo = variable; openScreen(id); },
  'open-group':        ({ group }) => openScreen(Object.values(MENU_TREE[group])[0][0].id),
  'back':              () => goBack(),
  'toggle-all-menu':   () => toggleAllMenu(),
  'mega-section':      ({ group, index }) => {
    showMegaMenu(group, Number(index));
    $(`#mega [data-index="${index}"]`).focus();
  },
  'toggle-menu-section': (data, element) => {
    const section = element.closest('.acc');
    const isOpen = !section.classList.contains('open');
    state.ui.openMenuSections[isOpen ? 'add' : 'delete'](section.dataset.key);
    setMenuSectionOpen(section, isOpen);
  },

  /* 로그인 · 설정 */
  'login':             ({ method }) => login(method),
  'logout':            () => logout(),
  'toggle-large-text': () => setLargeText(!state.ui.largeText, { announce: true }),
  /* 펀드변경 적합성진단 */
  'suit-start':        () => { closeModal(); state.screen.flow.suitAnswers = {}; showFundPhase('diagnose'); },
  'suit-edit':         () => showFundPhase('edit'),
  'suit-submit':       () => {
    const flow = state.screen.flow;
    const answers = flow.suitAnswers || {};
    const missing = SUITABILITY_QUESTIONS.map((_, index) => index).filter(index => answers[index] === undefined);
    missing.forEach(index => { $('#sqErr' + index).textContent = '답을 선택해 주세요.'; });
    if (missing.length) {
      announce(`${missing.length}개 문항에 답하지 않았습니다.`);
      return focusElement($(`#sq${missing[0]} input`));
    }
    const score = SUITABILITY_QUESTIONS.reduce((sum, [, options], index) => sum + options[answers[index]][1], 0);
    const profile = scoreToProfile(score);
    const { grade } = portfolioGrade(currentFundRatios(flow));
    const ok = requiredProfileFor(grade).level <= profile.level;
    Object.assign(SUITABILITY, { profile: profile.name, diagnosedAt: APP.today, failedOn: ok ? null : APP.today });
    flow.result = { ok, profile: profile.name, score, grade };
    showFundPhase('result');
  },
  'fund-compare':      () => showFundPhase('compare'),
  'fund-sign':         () => chooseSignMethod(SCREEN_BY_ID[state.route.screenId], () => completeSingleForm(state.screen.flow)),

  'toggle-planner':    (data, element) => {
    state.ui.showPlanner = !state.ui.showPlanner;
    element.setAttribute('aria-pressed', state.ui.showPlanner);
    render();
  },

  /* 바로가기 */
  'open-shortcut':     () => openShortcutGuide(),
  'shortcut-tab':      ({ tab }) => openShortcutGuide(tab),
  'download-shortcut': ({ kind }) => downloadShortcut(kind),
  'install-app':       () => { shortcut.installPrompt.prompt(); shortcut.installPrompt = null; closeModal(); },

  /* 공통 */
  'toast':             ({ message }) => toast(message),
  'skip-to-main':      (data, element, event) => { event?.preventDefault(); focusElement($('#main h1') || $('#main')); },
  'close-modal':       () => closeModal(),
  'open-notices':      ({ notice }) => openNoticeBoard(notice),
  'copy-text':         ({ text, label }) => copyText(text, label),

  /* 업무 화면: 목록(T2) */
  'set-period':        ({ period }) => { state.screen.list.period = period; rerenderScreen(); },
  'select-row':        ({ index }) => { state.screen.list.selectedRow = Number(index); rerenderScreen(); },
  'close-row':         () => { state.screen.list.selectedRow = null; rerenderScreen(); },
  'contract-tab':      ({ index }) => { state.screen.list.contractTab = Number(index); rerenderScreen(); },
  'variable-tab':      ({ no }) => {
    state.variableNo = no;
    if (state.screen.flow) Object.assign(state.screen.flow, { fundRatios: null, rebalance: false, phase: 'edit' });   // 펀드변경: 계약을 바꾸면 입력 초기화
    state.screen.list.selectedRow = null;
    rerenderScreen();
  },
  'cancel-request':    ({ index }) => confirmCancelRequest(Number(index)),
  'submit-documents':  () => {
    state.screen.list.selectedRow = null;
    LIST_SCREENS['SL-PY-02'].rows[0][3] = '처리중';
    rerenderScreen();
    toast('보완서류를 제출했습니다. 알림톡으로 결과를 알려드립니다.');
  },

  /* 업무 화면: 신청·변경·발급(T3~T5) */
  'pick':              ({ key }) => {
    const flow = state.screen.flow;
    flow.pick = key;
    STEP_FLOWS[state.route.screenId]?.pick.onPick?.(flow, key);
    rerenderScreen();
  },
  'step-prev':         () => { state.screen.flow.step--; showNextStep(); },
  'reset-flow':        () => { state.screen.flow = null; rerenderScreen(); },
};

function runAction(element, event) {
  const handler = ACTIONS[element.dataset.action];
  if (handler) handler(element.dataset, element, event);
}

function bindGlobalEvents() {
  document.addEventListener('click', event => {
    const target = event.target.closest('[data-action]');
    if (target && !target.disabled) runAction(target, event);
    if (!event.target.closest('.search')) $('#sug')?.setAttribute('hidden', '');
  });

  /* 키보드: 모달 안 Tab 순환 · Esc로 모달/메가메뉴 닫기 */
  document.addEventListener('keydown', event => {
    if (handleModalKeys(event)) return;
    if (event.key === 'Escape' && !$('#mega')?.hidden) {
      const group = $('#mega').dataset.group;
      hideMegaMenu();
      $(`#gnb [data-group="${group}"]`)?.focus();
    }
  });

  /* GNB에 마우스를 올리거나 포커스하면 메가메뉴 */
  const header = $('#header');
  const showForGnbButton = event => {
    const button = event.target.closest('#gnb [data-group]');
    const mega = $('#mega');
    if (button && (mega.hidden || mega.dataset.group !== button.dataset.group)) showMegaMenu(button.dataset.group);
  };
  header.addEventListener('mouseover', showForGnbButton);
  header.addEventListener('focusin', showForGnbButton);
  header.addEventListener('mouseleave', hideMegaMenu);
  header.addEventListener('focusout', event => { if (!header.contains(event.relatedTarget)) hideMegaMenu(); });

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    shortcut.installPrompt = event;
  });
}

/* 연금개시유형 선택/변경 (SL-CH-07) 선택조건 ------------------------------------
   연금유형에 따라 일부 항목은 값이 고정됨(lockRules) → 고정 항목은 다른 선택지를 숨기고 고정값만 보여줌 */
const NOT_APPLICABLE = '해당없음';
const ANNUITY_OPTION_FIELDS = [
  { id: 'type',   label: '연금유형',            type: 'radio', wide: true, options: ['종신연금', '확정연금', '상속연금(종신)'] },

  { id: 'growth', label: '체증형태',            type: 'radio', options: ['정액형', '체증형'] },
  { id: 'gTerm',  label: '체증기간',            type: 'radio', options: ['5년', '10년', NOT_APPLICABLE] },
  { id: 'gRate',  label: '체증율',              type: 'radio', options: ['5%', '10%', NOT_APPLICABLE] },
  { id: 'fixed',  label: '확정기간',            type: 'radio', options: ['10년', '15년', '20년', NOT_APPLICABLE] },
  { id: 'guar',   label: '보증기간',            type: 'radio', wide: true, options: ['10년', '20년', '80세', '100세', NOT_APPLICABLE] },
  { id: 'cycle',  label: '지급주기',            type: 'radio', wide: true, options: ['1개월', '3개월', '6개월', '매년'] },
  { id: 'early',  label: '조기집중형보장배수',   type: 'radio', wide: true, options: ['1.5배', '2배', '3배'] },
];

/** 현재 선택값 → 고정할 항목 { 항목id: [고정값, 사유] } */
function annuityLockRules(values) {
  const locks = {};
  const lock = (ids, value, reason) => ids.forEach(id => { locks[id] = [value, reason]; });
  const byType = `${values.type} 선택 시`;
  if (values.type === '종신연금') lock(['fixed'], NOT_APPLICABLE, byType);
  if (values.type === '확정연금') {
    lock(['growth'], '정액형', byType);
    lock(['gTerm', 'gRate', 'guar'], NOT_APPLICABLE, byType);
  }
  if (values.type === '상속연금(종신)') {
    lock(['growth'], '정액형', byType);
    lock(['gTerm', 'gRate', 'fixed', 'guar'], NOT_APPLICABLE, byType);
  }
  /* 종신연금에서 정액형을 고르면 체증기간·체증율은 의미가 없으므로 해당없음 */
  if (!locks.growth && values.growth === '정액형') lock(['gTerm', 'gRate'], NOT_APPLICABLE, '정액형 선택 시');
  return locks;
}

/** 선택 요약 + 회당 예상 연금액(예시) */
function annuityOptionCalc(values) {
  const v = { ...values };
  const base = { '종신연금': 1032000, '상속연금(종신)': 746000,
                 '확정연금': { '10년': 2050000, '15년': 1420000, '20년': 1168000 }[v.fixed] || 1168000 }[v.type || '종신연금'];
  const coupleFactor = v.payee === '부부형' ? { '50%': 0.95, '80%': 0.92, '100%': 0.88 }[v.ratio] || 0.88 : 1;
  const guarFactor = { '10년': 1, '20년': 0.98, '80세': 0.97, '100세': 0.93 }[v.guar] || 1;
  const growthFactor = v.growth === '체증형' ? (v.gRate === '10%' ? 0.78 : 0.88) : 1;
  const months = { '1개월': 1, '3개월': 3, '6개월': 6, '매년': 12 }[v.cycle] || 1;
  const monthly = Math.round(base * coupleFactor * guarFactor * growthFactor / 100) * 100;
  const shape = [v.type, v.payee, v.payee === '부부형' ? `연금비율 ${v.ratio}` : '', v.growth].filter(Boolean).join(' · ');
  return [
    ['선택한 연금형태', shape],
    ['지급주기', v.cycle || '1개월'],
    ['월 환산 예상액(예시)', formatWon(monthly)],
    [`회당 예상 연금액(${v.cycle || '1개월'})`, formatWon(monthly * months), true],
  ];
}

/** 고정 규칙을 화면에 반영: 고정 항목은 고정값만 보이고 선택 불가, 풀리면 원래 선택지로 */
function applyLockRules(root, config, flow) {
  Object.assign(flow.values, readFieldValues(root, config.fields));
  const locks = config.lockRules(flow.values);
  const changed = [];

  for (const field of config.fields) {
    const group = $(`[data-f="${field.id}"]`, root);
    if (!group) continue;
    const radios = $$(`input[name="${field.id}"]`, group);
    const [fixedValue, reason] = locks[field.id] || [];
    const isLocked = fixedValue !== undefined;
    const wasLocked = group.classList.contains('locked');

    radios.forEach(radio => {
      const isNotApplicable = radio.value === NOT_APPLICABLE;
      radio.disabled = isLocked;
      radio.closest('label').hidden = isLocked ? radio.value !== fixedValue : isNotApplicable;
      if (isLocked && radio.value === fixedValue) radio.checked = true;
    });
    if (!isLocked && $(`input[name="${field.id}"]:checked`, group)?.value === NOT_APPLICABLE) radios[0].checked = true;

    group.classList.toggle('locked', isLocked);
    let note = $('.lock-note', group);
    if (isLocked && !note) {
      note = document.createElement('span');
      note.className = 'help lock-note';
      note.id = `lk-${field.id}`;
      group.append(note);
      const radioGroup = $('[role=radiogroup]', group);
      radioGroup?.setAttribute('aria-describedby', `${radioGroup.getAttribute('aria-describedby') || ''} ${note.id}`.trim());
    }
    if (note) {
      note.hidden = !isLocked;
      note.textContent = isLocked ? `${reason} 고정` : '';
    }
    if (isLocked !== wasLocked) changed.push(`${field.label} ${isLocked ? `「${fixedValue}」 고정` : '다시 선택 가능'}`);
  }

  Object.assign(flow.values, readFieldValues(root, config.fields));
  return changed;
}
